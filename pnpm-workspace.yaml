  "@modelcontextprotocol/sdk": 1.30.0
  "@orpc/client": 1.15.4
  "@orpc/contract": 1.15.4
  "@orpc/openapi": 1.15.4
  "@orpc/openapi-client": 1.15.4
  "@orpc/server": 1.15.4
  "@orpc/zod": 1.15.4
  "@testcontainers/postgresql": 12.0.1
  "@types/node": 24.10.4
  "@types/oidc-provider": 9.12.1
  "@types/react": 19.2.14
  "@types/react-dom": 19.0.4
  argon2: 0.44.0
  eslint: 9.39.2
  exceljs: 4.4.0
  fastify: 5.12.5
  fflate: 0.8.3
  jose: 6.2.12
  mammoth: 1.12.0
  oidc-provider: 9.12.2
  pdf-parse: 2.4.5
  pdfjs-dist: ^6.3.289
  pg-boss: 12.30.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  postgres: 3.4.7
  react: 19.2.4
  react-dom: 19.2.4
  testcontainers: 12.0.1
  tsup: 8.5.1
  tsx: 4.23.15
  typescript: 5.9.3
  typescript-eslint: 8.51.0
  vitest: 4.1.11
  zod: 4.3.6

overrides:
  fast-xml-parser: ">=5.7.0"
  # exceljs (packages/parser) still `require()`s uuid, which dropped its CJS build in 12.0.0;
  # scope the bump to exceljs's own dependency so apps/api's direct (ESM) uuid dependency, pinned
  # in its own package.json, is untouched.
  exceljs>uuid: ">=11.1.1 <12.0.0"
  # gaxios 6 (via @google-cloud/storage) pins uuid ^9, which is vulnerable (< 11.1.1); 11.x still
  # ships the CJS build gaxios `require()`s.
  gaxios>uuid: ">=11.1.1 <12.0.0"
  # tsup 8.5.1 pins esbuild ^0.27.0; 0.27.3–0.28.0 are vulnerable, so lift it onto the patched line.
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"

autoInstallPeers: true
allowBuilds:
  argon2: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

{{- $app := include "exagram.appHost" . }}
{{- $uc := include "exagram.ucHost" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exagram.componentName" (list . "api") }}
  labels:
    {{- include "exagram.labels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "exagram.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# One replica only: the MCP rate limiter is in-process.
# The rolling update keeps the old api serving until the new one has passed wait-for-schema and
# readiness, so a failed migration leaves it up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exagram.componentName" (list . "api") }}
  labels:
    {{- include "exagram.labels" (list . "api") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "exagram.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exagram.labels" (list . "api") | nindent 8 }}
        {{- include "exagram.objectsLabel" . | nindent 8 }}
      {{- include "exagram.appPodAnnotations" . | nindent 6 }}
    spec:
      {{- include "exagram.imagePullSecrets" . | nindent 6 }}
      {{- include "exagram.podSecurityContext" (dict "uid" 1000 "pvc" (include "exagram.filesystem" .)) | nindent 6 }}
      {{- include "exagram.scheduling" (dict "ctx" . "objects" true) | nindent 6 }}
      initContainers:
        {{- include "exagram.waitForSchema" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "exagram.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Explicit allowlist matching deploy/compose.yml's api service.
          env:
            {{- include "exagram.valuesEnv" (dict "ctx" . "app" "api") | nindent 12 }}
            - name: HTTP_PORT
              value: "3000"
            - name: SHUTDOWN_TIMEOUT_SEC
              value: "30"
            - name: API_ORIGIN
              value: "https://{{ $app }}"
            - name: WEB_ORIGIN
              value: "https://{{ $app }}"
            - name: USERCONTENT_ORIGIN
              value: "https://{{ $uc }}"
            # Caddy overwrites X-Real-IP with the client address in both TLS modes.
            - name: CLIENT_IP_HEADER
              value: x-real-ip
            {{- include "exagram.databaseEnv" . | nindent 12 }}
            - name: SESSION_COOKIE_SECURE
              value: "true"
            {{- include "exagram.secretEnv" (list . "USERCONTENT_TOKEN_SECRET") | nindent 12 }}
            {{- include "exagram.secretEnv" (list . "UPLOAD_TOKEN_SECRET") | nindent 12 }}
            {{- include "exagram.storageEnv" (dict "ctx" . "app" "api") | nindent 12 }}
            {{- include "exagram.secretEnv" (list . "OIDC_COOKIE_KEYS") | nindent 12 }}
            {{- include "exagram.secretEnv" (list . "OIDC_JWKS") | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if or (include "exagram.filesystem" .) (include "exagram.dbCaMounted" .) }}
          volumeMounts:
            {{- if include "exagram.filesystem" . }}
            - name: objects
              mountPath: /var/lib/exagram/objects
            {{- end }}
            {{- if include "exagram.dbCaMounted" . }}
            - name: db-ca
              mountPath: /certs/db-ca.pem
              subPath: db-ca.pem
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          {{- include "exagram.containerSecurityContext" . | nindent 10 }}
      {{- $volumes := include "exagram.objectsVolume" . | trim }}
      {{- $ca := include "exagram.dbCaVolume" . | trim }}
      {{- if or $volumes $ca }}
      volumes:
        {{- with $volumes }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $ca }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}

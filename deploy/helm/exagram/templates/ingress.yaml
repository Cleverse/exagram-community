{{- if eq .Values.tls.mode "ingress" }}
{{- $app := include "exagram.appHost" . }}
{{- $uc := include "exagram.ucHost" . }}
{{- $web := include "exagram.componentName" (list . "web") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "exagram.fullname" . | quote }}
  labels:
    {{- include "exagram.labels" (list . "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := list $app $uc }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  name: http
    {{- end }}
{{- if .Values.ingress.networkPolicy.enabled }}
---
# Caddy trusts the client-address header from any private address, and every Pod has one, so only the
# ingress controller's namespace may reach web. Needs a CNI that enforces NetworkPolicy; without one,
# set ingress.trustedProxyCidrs instead. The second rule admits this release's `helm test` Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $web }}
  labels:
    {{- include "exagram.labels" (list . "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "exagram.selectorLabels" (list . "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | quote }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "exagram.selectorLabels" (list . "test") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}

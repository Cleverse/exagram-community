{{- $app := include "exagram.appHost" . }}
{{- $uc := include "exagram.ucHost" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exagram.componentName" (list . "usercontent") }}
  labels:
    {{- include "exagram.labels" (list . "usercontent") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "exagram.selectorLabels" (list . "usercontent") | nindent 4 }}
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exagram.componentName" (list . "usercontent") }}
  labels:
    {{- include "exagram.labels" (list . "usercontent") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "exagram.selectorLabels" (list . "usercontent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exagram.labels" (list . "usercontent") | nindent 8 }}
        {{- include "exagram.objectsLabel" . | nindent 8 }}
      {{- include "exagram.appPodAnnotations" . | nindent 6 }}
    spec:
      {{- include "exagram.imagePullSecrets" . | nindent 6 }}
      {{- include "exagram.podSecurityContext" (dict "uid" 1000 "pvc" (include "exagram.filesystem" .)) | nindent 6 }}
      {{- include "exagram.scheduling" (dict "ctx" . "objects" true) | nindent 6 }}
      initContainers:
        {{- include "exagram.waitForSchema" . | nindent 8 }}
      containers:
        - name: usercontent
          image: {{ include "exagram.image" (list . "usercontent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Explicit allowlist matching deploy/compose.yml's usercontent service: no OIDC or upload secrets
          # here, and no envFrom.
          env:
            {{- include "exagram.valuesEnv" (dict "ctx" . "app" "usercontent") | nindent 12 }}
            - name: HTTP_PORT
              value: "3002"
            {{- include "exagram.databaseEnv" . | nindent 12 }}
            {{- include "exagram.secretEnv" (list . "USERCONTENT_TOKEN_SECRET") | nindent 12 }}
            # /l/* on appHost is the Link page; the web app is also served from appHost.
            - name: USERCONTENT_FRAME_ANCESTORS
              value: "https://{{ $app }}"
            - name: USERCONTENT_ORIGIN
              value: "https://{{ $uc }}"
            {{- include "exagram.storageEnv" (dict "ctx" . "app" "usercontent") | nindent 12 }}
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if or (include "exagram.filesystem" .) (include "exagram.dbCaMounted" .) }}
          volumeMounts:
            {{- if include "exagram.filesystem" . }}
            - name: objects
              mountPath: /var/lib/exagram/objects
              readOnly: true
            {{- end }}
            {{- if include "exagram.dbCaMounted" . }}
            - name: db-ca
              mountPath: /certs/db-ca.pem
              subPath: db-ca.pem
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.usercontent | nindent 12 }}
          {{- include "exagram.containerSecurityContext" . | nindent 10 }}
      {{- $volumes := include "exagram.objectsVolume" . | trim }}
      {{- $ca := include "exagram.dbCaVolume" . | trim }}
      {{- if or $volumes $ca }}
      volumes:
        {{- with $volumes }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $ca }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}

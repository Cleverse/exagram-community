{{- if not .Values.existingSecret }}
{{- /*
Generated on first install and reused on every upgrade: lookup returns the live Secret, each random key
it already holds is kept, and only missing ones are generated, so an upgrade that adds a key works.
lookup returns nothing under `helm template` and client-side --dry-run, so GitOps renders must set
existingSecret instead. Keys derived from values (database URLs, store credentials) follow the values.
*/}}
{{- $name := include "exagram.fullname" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $live }}
{{- $old = $live.data | default dict }}
{{- end }}
{{- $data := dict }}
{{- range $key := list "USERCONTENT_TOKEN_SECRET" "UPLOAD_TOKEN_SECRET" "OIDC_COOKIE_KEYS" }}
{{- $_ := set $data $key (index $old $key | default (randAlphaNum 64 | b64enc)) }}
{{- end }}
{{- $_ := set $data "OIDC_JWKS" (index $old "OIDC_JWKS" | default (genPrivateKey "rsa" | b64enc)) }}
{{- if .Values.database.bundled }}
{{- $password := index $old "POSTGRES_PASSWORD" | default (randAlphaNum 48 | b64enc) }}
{{- $_ := set $data "POSTGRES_PASSWORD" $password }}
{{- $_ := set $data "DATABASE_URL" (include "exagram.bundledDatabaseUrl" (list . (b64dec $password)) | b64enc) }}
{{- $_ := set $data "MIGRATE_DATABASE_URL" (include "exagram.bundledMigrateDatabaseUrl" (list . (b64dec $password)) | b64enc) }}
{{- else }}
{{- $_ := set $data "DATABASE_URL" (.Values.database.external.url | b64enc) }}
{{- $_ := set $data "MIGRATE_DATABASE_URL" (.Values.database.external.migrateUrl | b64enc) }}
{{- end }}
{{- if eq .Values.storage.driver "s3" }}
{{- with .Values.storage.s3.accessKeyId }}{{ $_ := set $data "S3_ACCESS_KEY_ID" (b64enc .) }}{{ end }}
{{- with .Values.storage.s3.secretAccessKey }}{{ $_ := set $data "S3_SECRET_ACCESS_KEY" (b64enc .) }}{{ end }}
{{- else if eq .Values.storage.driver "gcs" }}
{{- with .Values.storage.gcs.serviceAccountKeyBase64 }}{{ $_ := set $data "GCS_SERVICE_ACCOUNT_KEY_BASE64" (b64enc .) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "exagram.labels" (list . "secret") | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: it holds the signing keys and the bundled database's password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}

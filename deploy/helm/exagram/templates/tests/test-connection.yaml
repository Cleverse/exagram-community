{{- /*
`helm test`: in-cluster checks over plain HTTP. Always: api /readiness and usercontent /readiness and
/uc/x (404) through their own Services. Web: in ingress mode, the SPA on appHost (200) and usercontent
through Caddy on ucHost (404 on /uc/x); in acme mode web serves HTTPS only once DNS points at the
LoadBalancer, so the check is Caddy's HTTP-to-HTTPS redirect for appHost on :80. HTTPS itself is
deploy/smoke.sh's job, run from outside once DNS resolves.
*/}}
{{- $app := include "exagram.appHost" . }}
{{- $uc := include "exagram.ucHost" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "exagram.componentName" (list . "test") }}
  labels:
    {{- include "exagram.labels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.podAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  restartPolicy: Never
  {{- include "exagram.imagePullSecrets" . | nindent 2 }}
  {{- include "exagram.scheduling" (dict "ctx" . "objects" false) | nindent 2 }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
  containers:
    - name: test
      image: {{ .Values.tests.image | quote }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          failures=0
          check() {
            name=$1; want=$2; shift 2
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@")
            if [ "$got" = "$want" ]; then echo "PASS: $name"; else echo "FAIL: $name (got $got, want $want)"; failures=$((failures + 1)); fi
          }
          check "api /readiness" 200 "http://$API/readiness"
          check "usercontent /readiness" 200 "http://$USERCONTENT/readiness"
          check "usercontent /uc/x -> 404" 404 "http://$USERCONTENT/uc/x"
          {{- if eq .Values.tls.mode "acme" }}
          check "web redirects appHost to https" 308 -H "Host: $APP_HOST" "http://$WEB/"
          {{- else }}
          check "web serves the SPA on appHost" 200 -H "Host: $APP_HOST" "http://$WEB/"
          check "web proxies api /readiness on appHost" 200 -H "Host: $APP_HOST" "http://$WEB/readiness"
          check "web routes ucHost to usercontent (/uc/x -> 404)" 404 -H "Host: $UC_HOST" "http://$WEB/uc/x"
          {{- end }}
          [ "$failures" -eq 0 ]
      env:
        - name: API
          value: "{{ include "exagram.componentName" (list . "api") }}:3000"
        - name: USERCONTENT
          value: "{{ include "exagram.componentName" (list . "usercontent") }}:3002"
        - name: WEB
          value: "{{ include "exagram.componentName" (list . "web") }}:80"
        - name: APP_HOST
          value: {{ $app | quote }}
        - name: UC_HOST
          value: {{ $uc | quote }}
      {{- include "exagram.containerSecurityContext" . | nindent 6 }}

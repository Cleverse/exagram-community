# Bundled Postgres layer: add to COMPOSE_FILE after compose.yml (gen-secrets.sh does this unless
# --external-db). The bundled URLs say sslmode=disable, so this layer lists its own service, and
# only that one, in DATABASE_PLAINTEXT_HOSTS.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: exagram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exagram
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exagram -d exagram"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  preflight:
    environment:
      DATABASE_PLAINTEXT_HOSTS: postgres

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      DATABASE_PLAINTEXT_HOSTS: postgres

  worker:
    environment:
      DATABASE_PLAINTEXT_HOSTS: postgres

  usercontent:
    environment:
      DATABASE_PLAINTEXT_HOSTS: postgres

volumes:
  postgres-data:

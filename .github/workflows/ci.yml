name: CI

on:
  push:
    branches: [main]
  pull_request:

# Must match the root package.json `turbo` devDependency: the probe and the installed turbo have to hash alike.
env:
  TURBO_VERSION: 2.11.4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every package's `lint` script runs its `typecheck` first, so this job covers both.
  lint:
    name: lint / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            args: run lint --filter=@exagram/web
          - name: api-core
            args: run lint --filter=@exagram/api --filter=@exagram/core
          - name: rest
            args: run lint --filter=!@exagram/web --filter=!@exagram/api --filter=!@exagram/core
    env:
      TURBO_ARGS: ${{ matrix.args }}
      TURBO_PASS: ""
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.name }}-

      # A dry run needs only the lockfile and package.json files, so when every task is already cached the
      # install is skipped and turbo replays the cached logs instead. Anything unclear counts as a miss.
      - name: Probe turbo cache
        id: probe
        run: |
          hit=false
          if pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS --dry=json $TURBO_PASS > "$RUNNER_TEMP/dry.json" &&
            jq -e '[.tasks[] | select(.command != "<NONEXISTENT>")] | length > 0 and all(.cache.status == "HIT")' "$RUNNER_TEMP/dry.json" > /dev/null; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: pnpm

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: |
          if [ "${{ steps.probe.outputs.hit }}" = true ]; then
            pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS $TURBO_PASS
          else
            pnpm turbo $TURBO_ARGS $TURBO_PASS
          fi

      - name: Check tsconfig references
        if: ${{ matrix.name == 'rest' }}
        run: node scripts/check-tsconfig-refs.mjs

      # Turbo caches only tasks that succeeded, so saving after a failure is safe.
      - if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}

  unit:
    runs-on: ubuntu-latest
    env:
      TURBO_ARGS: run test --filter=!@exagram/web
      TURBO_PASS: ""
    steps:
      - uses: actions/checkout@v5

      # The env.helm tests render deploy/helm/exagram and skip without helm, so this job always installs it.
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Helm lint and render
        run: |
          # A bare `helm lint` only logs a missing required value, so lint each values file instead.
          for values in deploy/helm/exagram/ci/*.yaml; do
            echo "helm lint and template -f $values"
            helm lint --strict deploy/helm/exagram -f "$values"
            helm template t deploy/helm/exagram -f "$values" > /dev/null
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      # A dry run needs only the lockfile and package.json files, so when every task is already cached the
      # install is skipped and turbo replays the cached logs instead. Anything unclear counts as a miss.
      - name: Probe turbo cache
        id: probe
        run: |
          hit=false
          if pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS --dry=json $TURBO_PASS > "$RUNNER_TEMP/dry.json" &&
            jq -e '[.tasks[] | select(.command != "<NONEXISTENT>")] | length > 0 and all(.cache.status == "HIT")' "$RUNNER_TEMP/dry.json" > /dev/null; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: pnpm

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          if [ "${{ steps.probe.outputs.hit }}" = true ]; then
            pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS $TURBO_PASS
          else
            pnpm turbo $TURBO_ARGS $TURBO_PASS
          fi

      # Turbo caches only tasks that succeeded, so saving after a failure is safe.
      - if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}

  # Vitest uses one worker on a 2-vCPU runner, so web tests are split across runners instead.
  web-unit:
    name: web-unit / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
    env:
      TURBO_ARGS: run test --filter=@exagram/web
      TURBO_PASS: -- --shard=${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.shard }}-

      # A dry run needs only the lockfile and package.json files, so when every task is already cached the
      # install is skipped and turbo replays the cached logs instead. Anything unclear counts as a miss.
      - name: Probe turbo cache
        id: probe
        run: |
          hit=false
          if pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS --dry=json $TURBO_PASS > "$RUNNER_TEMP/dry.json" &&
            jq -e '[.tasks[] | select(.command != "<NONEXISTENT>")] | length > 0 and all(.cache.status == "HIT")' "$RUNNER_TEMP/dry.json" > /dev/null; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: pnpm

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Web unit tests
        run: |
          if [ "${{ steps.probe.outputs.hit }}" = true ]; then
            pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS $TURBO_PASS
          else
            pnpm turbo $TURBO_ARGS $TURBO_PASS
          fi

      # Turbo caches only tasks that succeeded, so saving after a failure is safe.
      - if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}

  # Each vitest process starts its own Postgres container, so shards do not share a database.
  integration:
    name: integration / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-1
            args: run test:integration --filter=@exagram/api
            pass: -- --shard=1/3
          - name: api-2
            args: run test:integration --filter=@exagram/api
            pass: -- --shard=2/3
          - name: api-3
            args: run test:integration --filter=@exagram/api
            pass: -- --shard=3/3
          - name: others
            args: run test:integration --filter=@exagram/core --filter=@exagram/worker --filter=@exagram/usercontent
            pass: ""
    env:
      TURBO_ARGS: ${{ matrix.args }}
      TURBO_PASS: ${{ matrix.pass }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.name }}-

      # A dry run needs only the lockfile and package.json files, so when every task is already cached the
      # install is skipped and turbo replays the cached logs instead. Anything unclear counts as a miss.
      - name: Probe turbo cache
        id: probe
        run: |
          hit=false
          if pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS --dry=json $TURBO_PASS > "$RUNNER_TEMP/dry.json" &&
            jq -e '[.tasks[] | select(.command != "<NONEXISTENT>")] | length > 0 and all(.cache.status == "HIT")' "$RUNNER_TEMP/dry.json" > /dev/null; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: pnpm

      - if: ${{ steps.probe.outputs.hit != 'true' }}
        run: pnpm install --frozen-lockfile

      # Pre-pull so a cold image pull does not present as a hung test.
      - if: ${{ steps.probe.outputs.hit != 'true' }}
        name: Pre-pull postgres
        run: docker pull postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

      - name: Integration tests
        run: |
          if [ "${{ steps.probe.outputs.hit }}" = true ]; then
            pnpm dlx turbo@$TURBO_VERSION $TURBO_ARGS $TURBO_PASS
          else
            pnpm turbo $TURBO_ARGS $TURBO_PASS
          fi

      # Turbo caches only tasks that succeeded, so saving after a failure is safe.
      - if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}

  # Single status for the PR; a cancelled or skipped dependency must not read as green.
  check:
    if: ${{ always() }}
    needs:
      - lint
      - unit
      - web-unit
      - integration
      - sqlc
      - images
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

  sqlc:
    runs-on: ubuntu-latest
    # sqlc cannot resolve the column types of a RETURNS TABLE SQL function from the schema files
    # alone, so sqlc.yaml also points it at a live, migrated database for introspection.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: exagram
          POSTGRES_PASSWORD: exagram
          POSTGRES_DB: exagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exagram -d exagram"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.29.0"

      - name: Apply migrations
        run: make local-migrate-up
        env:
          DATABASE_URL: postgres://exagram:exagram@localhost:5432/exagram?sslmode=disable&search_path=exagram%2Cpublic

      - name: sqlc compile
        run: sqlc compile

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gen-secrets accept/reject table and compose renders
        run: deploy/gen-secrets.test.sh

      # The smoke test builds only the api, worker and usercontent images, so a PR that touches none of their
      # inputs (web, landing, macos, docs) skips it. Pushes to main always build.
      - name: Check image inputs
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A failed diff leaves "changed" holding a sentinel that matches, so the build runs.
          changed=$(git diff --name-only "$BASE_SHA"...HEAD) || changed=Dockerfile
          if [ -z "$BASE_SHA" ] || echo "$changed" | grep -qE \
            '^(Dockerfile|\.dockerignore|\.npmrc|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|apps/(api|worker|usercontent)/|packages/|database/|deploy/|scripts/image-smoke\.sh|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.inputs.outputs.build == 'true' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ steps.inputs.outputs.build == 'true' }}
        name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - if: ${{ steps.inputs.outputs.build == 'true' }}
        name: Image smoke tests
        env:
          SMOKE_BUILD_ARGS: >-
            --cache-from=type=gha,scope=exagram-image-smoke
            --cache-to=type=gha,mode=max,scope=exagram-image-smoke
        run: scripts/image-smoke.sh
